<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Area &amp; Perimeter Quiz</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F5F4F0;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:1.5rem 1rem 3rem}
  #app{width:100%;max-width:540px}

  /* START SCREEN */
  .ttl{font-size:26px;font-weight:600;text-align:center;color:#1a1a18;margin-bottom:4px;padding-top:.25rem}
  .sub{font-size:14px;color:#888780;text-align:center;margin-bottom:1.75rem}
  .db{width:100%;display:flex;align-items:center;gap:14px;padding:16px 18px;background:#fff;border:1px solid #E4E3DD;border-radius:14px;cursor:pointer;margin-bottom:10px;text-align:left;font-family:inherit;transition:background .15s,transform .1s,box-shadow .1s}
  .db:hover{background:#FAFAF7;box-shadow:0 2px 8px rgba(0,0,0,.06)}
  .db:active{transform:scale(.99)}
  .di{width:46px;height:46px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:22px}
  .dl{font-size:17px;font-weight:600;margin-bottom:3px}
  .dd{font-size:13px;color:#888780}
  .da{font-size:20px;color:#C4C2B8;margin-left:auto}

  /* QUIZ */
  .pg{height:8px;background:#E4E3DD;border-radius:4px;margin-bottom:1rem;overflow:hidden}
  .pf{height:100%;border-radius:4px;transition:width .4s ease}
  .mr{display:flex;justify-content:space-between;background:#fff;border:1px solid #E4E3DD;border-radius:12px;padding:10px 16px;margin-bottom:.75rem;font-size:13px;color:#888780}
  .mr strong{font-weight:600;color:#1a1a18}
  .cd{background:#fff;border:1px solid #E4E3DD;border-radius:14px;padding:1.25rem;margin-bottom:.75rem}
  .bdg{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;margin-bottom:10px;letter-spacing:.05em;text-transform:uppercase}
  .bdg.area{background:#E1F5EE;color:#0F6E56}
  .bdg.perim{background:#E6F1FB;color:#0C447C}
  .bdg.miss{background:#FAEEDA;color:#633806}
  .qt{font-size:16px;color:#1a1a18;line-height:1.6;margin-bottom:1rem}
  .hint{font-size:12px;color:#B4B2A9;font-style:italic;margin-bottom:.875rem}
  .sv{display:flex;justify-content:center;margin-bottom:1rem}
  .wb{background:#F5F4F0;border-radius:10px;padding:14px 16px;font-size:15px;line-height:1.7;color:#1a1a18;margin-bottom:1rem;border-left:3px solid #E4E3DD}
  .cho{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .cb{padding:15px 8px;font-size:18px;font-weight:600;background:#F5F4F0;border:1px solid #D3D1C7;border-radius:12px;cursor:pointer;color:#1a1a18;transition:background .12s,transform .1s;font-family:inherit}
  .cb:hover:not([disabled]){background:#EEEDEA;border-color:#B4B2A9}
  .cb:active:not([disabled]){transform:scale(.97)}
  .cb.ok{background:#EAF3DE;border-color:#639922;color:#27500A}
  .cb.er{background:#FCEBEB;border-color:#E24B4A;color:#791F1F}
  .fb{border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.7;display:none;margin-bottom:.75rem}
  .fb.ok{background:#EAF3DE;color:#1a1a18}
  .fb.er{background:#FCEBEB;color:#1a1a18}
  .fcalc{font-size:13px;color:#5F5E5A;font-style:italic;display:block;margin-top:2px}
  .go{width:100%;padding:13px;font-size:16px;font-weight:600;border:none;border-radius:12px;cursor:pointer;color:#fff;margin-top:10px;font-family:inherit;transition:opacity .15s,transform .1s}
  .go:hover{opacity:.88}
  .go:active{transform:scale(.98)}

  /* END */
  .ew{text-align:center;padding:2rem 0}
  .eicon{font-size:28px;margin-bottom:8px}
  .escore{font-size:56px;font-weight:700;margin:8px 0}
  .emsg{font-size:15px;color:#888780;margin-bottom:1.75rem;line-height:1.5}
  .ebtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .sb{padding:13px;font-size:15px;font-weight:600;background:#F5F4F0;border:1px solid #D3D1C7;border-radius:12px;cursor:pointer;color:#1a1a18;font-family:inherit;transition:background .12s}
  .sb:hover{background:#EEEDEA}

  /* Badge dot indicator */
  .diff-tag{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
</style>
</head>
<body>
<div id="app"></div>
<script>
var CS=28, PD=22;

var PRAISE=["Great job!","You got it!","Awesome!","Perfect!","Nailed it!","Excellent!","Correct!"];
var WRONG=["Not quite — keep going!","Almost! You'll get it.","Good effort — keep trying!","So close! Check the formula."];

var DIFFS={
  easy:{l:'Easy',e:'📐',d:'Visual shapes · Small numbers · Grades 3–4',c:'#1D9E75',b:'rgba(29,158,117,.12)',mn:2,mx:7,nV:10,nW:0,nM:0},
  hard:{l:'Hard',e:'📏',d:'Bigger numbers · Word problems · Some missing sides',c:'#BA7517',b:'rgba(186,117,23,.12)',mn:5,mx:13,nV:4,nW:4,nM:2},
  hardest:{l:'Hardest',e:'🔥',d:'Large numbers · Word problems · Find the missing side',c:'#E24B4A',b:'rgba(226,75,74,.12)',mn:8,mx:22,nV:2,nW:4,nM:4}
};

// --- Word problem templates ---
var TPL_AREA=[
  function(w,h,u){return 'A garden is '+w+' '+u+' long and '+h+' '+u+' wide. What is the <strong>area</strong> of the garden?';},
  function(w,h,u){return 'A classroom floor is '+w+' '+u+' long and '+h+' '+u+' wide. How many square '+u+' of carpet are needed to cover it?';},
  function(w,h,u){return 'A swimming pool is '+w+' '+u+' long and '+h+' '+u+' wide. What is the <strong>area</strong> of the pool?';},
  function(w,h,u){return 'A farmer\'s field is '+w+' '+u+' long and '+h+' '+u+' wide. What is the total <strong>area</strong>?';},
  function(w,h,u){return 'A playground is '+w+' '+u+' by '+h+' '+u+'. What is the <strong>area</strong> the kids can use?';},
  function(w,h,u){return 'A tabletop measures '+w+' '+u+' by '+h+' '+u+'. What is the <strong>area</strong> of the surface?';},
  function(w,h,u){return 'A gym floor is '+w+' '+u+' long and '+h+' '+u+' wide. How many square '+u+' is the floor?';},
  function(w,h,u){return 'A solar panel is '+w+' '+u+' wide and '+h+' '+u+' tall. What is its total <strong>area</strong>?';}
];

var TPL_PERIM=[
  function(w,h,u){return 'A garden is '+w+' '+u+' long and '+h+' '+u+' wide. How many '+u+' of fencing are needed to go all the way around it?';},
  function(w,h,u){return 'A picture frame is '+w+' '+u+' wide and '+h+' '+u+' tall. What is the <strong>perimeter</strong> of the frame?';},
  function(w,h,u){return 'A soccer field is '+w+' '+u+' long and '+h+' '+u+' wide. How far is it to walk all the way around the field?';},
  function(w,h,u){return 'A room is '+w+' '+u+' long and '+h+' '+u+' wide. How many '+u+' of baseboard trim goes along all four walls?';},
  function(w,h,u){return 'A park path goes around the outside of a '+w+' by '+h+' '+u+' park. How long is the path in total?';},
  function(w,h,u){return 'A pool deck is '+w+' '+u+' long and '+h+' '+u+' wide. What is the <strong>perimeter</strong>?';},
  function(w,h,u){return 'A bulletin board is '+w+' '+u+' wide and '+h+' '+u+' tall. How many '+u+' of border trim goes all the way around?';},
  function(w,h,u){return 'A rectangular stage is '+w+' '+u+' long and '+h+' '+u+' wide. What is the total <strong>perimeter</strong>?';}
];

var TPL_MISS_AREA=[
  function(a,s,u){return 'A rectangle has an <strong>area of '+a+' sq '+u+'</strong>. One side is '+s+' '+u+' long. What is the length of the <strong>missing side</strong>?';},
  function(a,s,u){return 'A garden has an <strong>area of '+a+' sq '+u+'</strong>. Its length is '+s+' '+u+'. What is the <strong>width</strong> of the garden?';},
  function(a,s,u){return 'A floor has an <strong>area of '+a+' sq '+u+'</strong>. One wall is '+s+' '+u+' long. How long is the <strong>other wall</strong>?';},
  function(a,s,u){return 'A pool has an <strong>area of '+a+' sq '+u+'</strong>. The length is '+s+' '+u+'. What is the <strong>width</strong>?';},
  function(a,s,u){return 'A field has an <strong>area of '+a+' sq '+u+'</strong>. One side is '+s+' '+u+'. What is the <strong>other side</strong>?';}
];

var TPL_MISS_PERIM=[
  function(p,s,u){return 'A rectangle has a <strong>perimeter of '+p+' '+u+'</strong>. One side is '+s+' '+u+'. What is the <strong>other side</strong>?';},
  function(p,s,u){return 'A garden has a <strong>perimeter of '+p+' '+u+'</strong>. The length is '+s+' '+u+'. What is the <strong>width</strong>?';},
  function(p,s,u){return 'A fence goes all around a yard. Total fence: <strong>'+p+' '+u+'</strong>. One side is '+s+' '+u+'. What is the <strong>other side</strong>?';},
  function(p,s,u){return 'A pool has a <strong>perimeter of '+p+' '+u+'</strong>. One side is '+s+' '+u+'. What is the <strong>other side</strong>?';},
  function(p,s,u){return 'A stage has a <strong>perimeter of '+p+' '+u+'</strong>. The length is '+s+' '+u+'. What is the <strong>width</strong>?';}
];

var UNITS={easy:['units'],hard:['feet','meters','feet','meters'],hardest:['feet','meters','inches','yards','feet','meters']};

// --- Helpers ---
function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function rp(a){return a[Math.floor(Math.random()*a.length)];}
function sh(a){return a.slice().sort(function(){return Math.random()-.5;});}
function ru(d){return rp(UNITS[d]);}

function makeWrongs(ans,w,h,isArea){
  var s=new Set();
  if(isArea){
    [2*(w+h), ans+2, Math.max(1,ans-2), w+h, ans+w, ans+h, w*(h+1), (w+1)*h, ans+4, Math.max(1,ans-4)].forEach(function(x){s.add(x);});
  } else {
    [w*h, ans+2, Math.max(2,ans-2), w+h, ans+4, Math.max(4,ans-4), 2*w+h, w+2*h, ans+6, Math.max(2,ans-6)].forEach(function(x){s.add(x);});
  }
  s.delete(ans);
  var v=Array.from(s).filter(function(x){return x>0 && x!==ans;});
  v=Array.from(new Set(v));
  while(v.length<3) v.push(ans+v.length*11+7);
  return sh(v).slice(0,3);
}

function makeMissWrongs(ans,kn,tot,isArea){
  var s=new Set();
  [ans+1, Math.max(1,ans-1), ans+2, Math.max(1,ans-2), ans+3, kn, ans+4, Math.max(1,ans-3)].forEach(function(x){s.add(x);});
  if(isArea){
    s.add(tot-kn);
    s.add(Math.max(1, Math.round(tot/(kn+1))));
  } else {
    s.add(tot-kn);
    s.add(Math.floor(tot/2));
    s.add(ans+kn);
  }
  s.delete(ans);
  var v=Array.from(s).filter(function(x){return x>0 && Number.isInteger(x) && x!==ans;});
  v=Array.from(new Set(v));
  while(v.length<3) v.push(ans+v.length*8+6);
  return sh(v).slice(0,3);
}

// --- Question generators ---
function genVisual(d){
  var cfg=DIFFS[d], mx=Math.min(cfg.mx,9);
  var sq=Math.random()<.2;
  var w=ri(cfg.mn,mx), h=sq?w:ri(cfg.mn,mx);
  if(w===h && !sq) h=h<mx?h+1:h-1;
  var isA=Math.random()<.5, ans=isA?w*h:2*(w+h);
  return {
    tp:'v', isA:isA, w:w, h:h, ans:ans, u:'units',
    uL:isA?'sq units':'units',
    ch:sh([ans].concat(makeWrongs(ans,w,h,isA))),
    ht:isA?'Area = length × width':'Perimeter = 2 × (length + width)',
    cx:isA?(w+' × '+h+' = '+ans+' sq units'):('2 × ('+w+' + '+h+') = '+ans+' units'),
    qt:'What is the <strong style="color:'+(isA?'#0F6E56':'#185FA5')+'">'+(isA?'area':'perimeter')+'</strong> of this '+(sq?'square':'rectangle')+'?'
  };
}

function genWord(d){
  var cfg=DIFFS[d];
  var w=ri(cfg.mn,cfg.mx), h=ri(cfg.mn,cfg.mx);
  if(w===h) h=h<cfg.mx?h+1:h-1;
  var isA=Math.random()<.5, ans=isA?w*h:2*(w+h), u=ru(d);
  return {
    tp:'w', isA:isA, w:w, h:h, ans:ans, u:u,
    uL:isA?('sq '+u):u,
    ch:sh([ans].concat(makeWrongs(ans,w,h,isA))),
    ht:isA?'Area = length × width':'Perimeter = 2 × (length + width)',
    cx:isA?(w+' × '+h+' = '+ans+' sq '+u):('2 × ('+w+' + '+h+') = '+ans+' '+u),
    qt:rp(isA?TPL_AREA:TPL_PERIM)(w,h,u)
  };
}

function genMissing(d){
  var cfg=DIFFS[d], cap=Math.min(cfg.mx,18);
  var w=ri(cfg.mn,cap), h=ri(cfg.mn,cap);
  if(w===h) h=h<cap?h+1:h-1;
  var isA=Math.random()<.5, info=isA?w*h:2*(w+h), ans=h, u=ru(d);
  return {
    tp:'m', isA:isA, w:w, h:h, ans:ans, u:u, uL:u, info:info,
    ch:sh([ans].concat(makeMissWrongs(ans,w,info,isA))),
    ht:isA?'Missing side = Area ÷ known side':'Missing side = (Perimeter ÷ 2) − known side',
    cx:isA?(info+' ÷ '+w+' = '+ans+' '+u):('('+info+' ÷ 2) − '+w+' = '+ans+' '+u),
    qt:rp(isA?TPL_MISS_AREA:TPL_MISS_PERIM)(info,w,u)
  };
}

function buildQuiz(d){
  var cfg=DIFFS[d], qs=[];
  for(var i=0;i<cfg.nV;i++) qs.push(genVisual(d));
  for(var i=0;i<cfg.nW;i++) qs.push(genWord(d));
  for(var i=0;i<cfg.nM;i++) qs.push(genMissing(d));
  return sh(qs);
}

// --- SVG ---
function svgGrid(w,h,isA){
  var sw=w*CS+PD*2+28, sh=h*CS+PD*2+28, x0=PD+20, y0=PD+12;
  var fc=isA?'rgba(29,158,117,.18)':'rgba(24,95,165,.18)';
  var sc=isA?'#1D9E75':'#185FA5';
  var g='';
  for(var i=0;i<=w;i++) g+='<line x1="'+(x0+i*CS)+'" y1="'+y0+'" x2="'+(x0+i*CS)+'" y2="'+(y0+h*CS)+'" stroke="rgba(136,135,128,.3)" stroke-width=".75"/>';
  for(var j=0;j<=h;j++) g+='<line x1="'+x0+'" y1="'+(y0+j*CS)+'" x2="'+(x0+w*CS)+'" y2="'+(y0+j*CS)+'" stroke="rgba(136,135,128,.3)" stroke-width=".75"/>';
  return '<svg width="'+sw+'" height="'+sh+'" xmlns="http://www.w3.org/2000/svg">'+g+'<rect x="'+x0+'" y="'+y0+'" width="'+(w*CS)+'" height="'+(h*CS)+'" fill="'+fc+'" stroke="'+sc+'" stroke-width="2.5" rx="2"/><text x="'+(x0+w*CS/2)+'" y="'+(y0-8)+'" text-anchor="middle" font-size="14" font-weight="600" fill="'+sc+'" font-family="system-ui,sans-serif">'+w+'</text><text x="'+(x0-12)+'" y="'+(y0+h*CS/2)+'" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="600" fill="'+sc+'" font-family="system-ui,sans-serif">'+h+'</text></svg>';
}

function svgMissing(kn,info,isA,u){
  var W=130, H=82, X=62, Y=32, sw=W+X*2, sh=H+Y*2+16;
  var ic=isA?'#0F6E56':'#0C447C';
  var infoTxt=isA?('Area = '+info+' sq '+u):('Perimeter = '+info+' '+u);
  var knLabel=u==='units'?String(kn):(kn+' '+u);
  return '<svg width="'+sw+'" height="'+sh+'" xmlns="http://www.w3.org/2000/svg"><rect x="'+X+'" y="'+Y+'" width="'+W+'" height="'+H+'" fill="rgba(136,135,128,.06)" stroke="rgba(136,135,128,.35)" stroke-width="2" rx="2" stroke-dasharray="7,4"/><text x="'+(X+W/2)+'" y="'+(Y-10)+'" text-anchor="middle" font-size="13" font-weight="600" fill="#1D9E75" font-family="system-ui,sans-serif">'+knLabel+'</text><text x="'+(X-18)+'" y="'+(Y+H/2)+'" text-anchor="middle" dominant-baseline="middle" font-size="24" font-weight="700" fill="#E24B4A" font-family="system-ui,sans-serif">?</text><text x="'+(X+W/2)+'" y="'+(Y+H/2)+'" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="'+ic+'" font-family="system-ui,sans-serif">'+infoTxt+'</text></svg>';
}

// --- State ---
var S={scr:'start', d:null, qs:[], i:0, sc:0, done:false};

// --- Render ---
function render(){
  document.getElementById('app').innerHTML = S.scr==='start'?renderStart():S.scr==='quiz'?renderQuiz():renderEnd();
}

function renderStart(){
  var html='<div style="padding:.75rem 0">';
  html+='<div class="ttl">📐 Area &amp; Perimeter</div>';
  html+='<div class="sub">Shape Math Quiz &mdash; pick your difficulty to begin</div>';
  var keys=Object.keys(DIFFS);
  keys.forEach(function(k){
    var cfg=DIFFS[k];
    html+='<button class="db" onclick="startQ(\''+k+'\')"><div class="di" style="background:'+cfg.b+'">'+cfg.e+'</div><div style="flex:1"><div class="dl" style="color:'+cfg.c+'">'+cfg.l+'</div><div class="dd">'+cfg.d+'</div></div><div class="da">›</div></button>';
  });
  html+='</div>';
  return html;
}

function renderQuiz(){
  var q=S.qs[S.i], cfg=DIFFS[S.d];
  var bdgClass=q.tp==='m'?'miss':q.isA?'area':'perim';
  var bdgTxt=q.tp==='m'?'Missing side':q.isA?'Area':'Perimeter';

  var body='';
  if(q.tp==='v'){
    body='<div class="qt">'+q.qt+'</div><div class="sv">'+svgGrid(q.w,q.h,q.isA)+'</div>';
  } else if(q.tp==='w'){
    body='<div class="wb">'+q.qt+'</div>';
  } else {
    body='<div class="sv">'+svgMissing(q.w,q.info,q.isA,q.u)+'</div><div class="wb">'+q.qt+'</div>';
  }

  var choices=q.ch.map(function(c){
    return '<button class="cb" data-v="'+c+'" onclick="choose('+c+',this)">'+c+' '+q.uL+'</button>';
  }).join('');

  var pct=Math.round(S.i/10*100);
  return '<div class="pg"><div class="pf" style="width:'+pct+'%;background:'+cfg.c+'"></div></div>'
    +'<div class="mr"><span>Question <strong>'+(S.i+1)+'</strong> of 10</span><span>Score: <strong>'+S.sc+'</strong> / '+S.i+'</span></div>'
    +'<div class="cd"><span class="bdg '+bdgClass+'">'+bdgTxt+'</span>'
    +body
    +'<div class="hint">💡 '+q.ht+'</div>'
    +'<div class="cho">'+choices+'</div></div>'
    +'<div class="fb" id="fb"></div>';
}

function renderEnd(){
  var pct=Math.round(S.sc/10*100), cfg=DIFFS[S.d];
  var icon=pct>=90?'🌟':pct>=70?'🎉':pct>=50?'💪':'📐';
  var msg=pct>=90?'Superstar! Amazing work!':pct>=70?'Great job! Keep it up!':pct>=50?'Good effort! Practice makes perfect.':'Keep practicing — you\'re getting there!';
  var scoreColor=pct>=70?'#1D9E75':pct>=50?'#BA7517':'#E24B4A';
  return '<div class="cd"><div class="ew">'
    +'<div class="eicon">'+icon+'</div>'
    +'<div class="escore" style="color:'+scoreColor+'">'+S.sc+' / 10</div>'
    +'<div class="emsg">'+msg+'<br><span style="font-size:13px;color:#B4B2A9">'+pct+'% on <strong style="color:#5F5E5A">'+cfg.l+'</strong> difficulty</span></div>'
    +'<div class="ebtns">'
    +'<button class="sb" onclick="goStart()">Change difficulty</button>'
    +'<button class="go" style="background:'+cfg.c+'" onclick="startQ(\''+S.d+'\')">Play again</button>'
    +'</div></div></div>';
}

// --- Events ---
function startQ(d){
  S={scr:'quiz', d:d, qs:buildQuiz(d), i:0, sc:0, done:false};
  render();
}

function choose(val,btn){
  if(S.done) return;
  S.done=true;
  var q=S.qs[S.i];
  var ok=(val===q.ans);
  if(ok) S.sc++;
  document.querySelectorAll('.cb').forEach(function(b){
    b.disabled=true;
    if(parseInt(b.dataset.v)===q.ans) b.classList.add('ok');
    else if(b===btn && !ok) b.classList.add('er');
  });
  var cfg=DIFFS[S.d];
  var fb=document.getElementById('fb');
  fb.style.display='block';
  fb.className='fb '+(ok?'ok':'er');
  var emoji=ok?'✓':'✗';
  var mainMsg=ok?(emoji+' '+rp(PRAISE)):(emoji+' '+rp(WRONG)+' The answer is <strong>'+q.ans+' '+q.uL+'</strong>.');
  fb.innerHTML='<span>'+mainMsg+'</span>'
    +'<span class="fcalc">'+q.cx+'</span>'
    +'<button class="go" style="background:'+cfg.c+'" onclick="nextQ()">'+( S.i<9?'Next question →':'See my results!')+'</button>';
}

function nextQ(){
  S.i++;
  S.done=false;
  if(S.i>=10){ S.scr='end'; render(); }
  else { document.getElementById('app').innerHTML=renderQuiz(); }
}

function goStart(){ S.scr='start'; render(); }

render();
</script>
</body>
</html>
